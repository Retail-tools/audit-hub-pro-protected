<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit HUB Pro — Secure Login</title>
    <link rel="icon" href="assets/images/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #EEF1F5 0%, #E4E9EF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #FFFFFF;
            border-radius: 22px;
            box-shadow: 0 26px 60px rgba(10, 27, 51, 0.18);
            padding: 54px 40px;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 32px;
        }

        .logo-section img {
            height: 56px;
            width: auto;
            margin-bottom: 16px;
        }

        .logo-section h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #0A1B33;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .logo-section p {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8592A3;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: #DCE2E9;
            margin: 28px 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1B2536;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #DCE2E9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
            background: #FFFFFF;
            color: #1B2536;
        }

        .form-group input::placeholder {
            color: #8592A3;
        }

        .form-group input:focus {
            border-color: #A5332A;
            box-shadow: 0 0 0 4px rgba(165, 51, 42, 0.12);
        }

        .error-message {
            display: none;
            background: #F7E8E6;
            color: #A5332A;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            border-left: 3px solid #A5332A;
            text-align: left;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            background: #0A1B33;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            background: #A5332A;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(165, 51, 42, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #8592A3;
            line-height: 1.6;
        }

        .footer-text strong {
            color: #5C6B80;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="assets/images/logo-mark.png" alt="Audit HUB Pro">
                <h1>Audit HUB Pro</h1>
                <p>Secure Access</p>
            </div>

            <div class="divider"></div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Login</button>
            </form>

            <div class="footer-text">
                <strong>Audit HUB Pro</strong><br>
                Retail Operations Toolkit by Vicky Shaw
            </div>
        </div>
    </div>

    <script>
        // Correct password (CHANGE THIS TO YOUR PASSWORD)
        const CORRECT_PASSWORD = "ptsretail";

        function handleLogin(event) {
            event.preventDefault();

            const passwordInput = document.getElementById("password");
            const password = passwordInput.value;
            const errorDiv = document.getElementById("errorMessage");
            const submitBtn = document.getElementById("submitBtn");

            // Disable button while processing
            submitBtn.disabled = true;

            // Simulate slight delay for user feedback
            setTimeout(() => {
                if (password === CORRECT_PASSWORD) {
                    // Save auth token in sessionStorage (cleared when browser closes)
                    sessionStorage.setItem("auditHubAuth", "true");
                    sessionStorage.setItem("auditHubAuthTime", new Date().getTime());
                    
                    // Redirect to main site
                    window.location.href = "index.html";
                } else {
                    // Show error message
                    errorDiv.textContent = "Invalid password. Please try again.";
                    errorDiv.classList.add("show");
                    passwordInput.value = "";
                    passwordInput.focus();
                    submitBtn.disabled = false;

                    // Auto-hide error after 5 seconds
                    setTimeout(() => {
                        errorDiv.classList.remove("show");
                    }, 5000);
                }
            }, 300);
        }

        // Prevent going back to login if already authenticated
        window.onload = function() {
            if (sessionStorage.getItem("auditHubAuth") === "true") {
                window.location.href = "index.html";
            }
            // Focus password field on load
            document.getElementById("password").focus();
        };

        // Allow Enter key to submit
        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                document.getElementById("loginForm").dispatchEvent(new Event("submit"));
            }
        });
    </script>
</body>
</html>
